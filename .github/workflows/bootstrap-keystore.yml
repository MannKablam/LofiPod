name: Bootstrap signing keystore

# One-shot workflow. Trigger from the Actions tab → "Bootstrap signing keystore"
# → Run workflow. It will run `app/generate-keystore.sh` on the runner (which
# has JDK + keytool already installed) and upload `lofipod-dev.jks` as an
# artifact. Download the artifact, drop the file into `app/lofipod-dev.jks`
# locally, commit, push. From then on every build signs with the same cert
# and updates install in place over previous versions — no more uninstall.
#
# Manual-only trigger so it never fires on a regular push (we don't want to
# regenerate the keystore by accident — that would re-introduce the
# "different signer, must uninstall" pain).

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Refuse to overwrite an existing keystore
        run: |
          if [ -f app/lofipod-dev.jks ]; then
            echo "::error::app/lofipod-dev.jks already exists in the repo. Delete it first if you really mean to regenerate (this will break update-in-place for installed APKs)."
            exit 1
          fi

      - name: Generate keystore
        run: bash app/generate-keystore.sh

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: lofipod-dev-keystore
          path: app/lofipod-dev.jks
          if-no-files-found: error
          retention-days: 7
