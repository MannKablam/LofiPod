name: Bootstrap signing keystore

# One-shot workflow. Trigger from the Actions tab → "Bootstrap signing keystore"
# → Run workflow. It will:
#   1. Generate a strong random password.
#   2. Run `app/generate-keystore.sh` on the runner (which has JDK + keytool
#      already installed) to produce `lofipod-dev.jks` signed with that
#      password.
#   3. Upload the keystore as the `lofipod-dev-keystore` artifact AND the
#      password as a separate `lofipod-dev-keystore-password` artifact.
#
# What you do next:
#   - Download the password artifact, save the password to your password
#     manager.
#   - Add it as a repo secret: GitHub → Settings → Secrets and variables →
#     Actions → New repository secret → name `LOFIPOD_KEYSTORE_PASSWORD`,
#     value the generated password.
#   - Download the keystore artifact, drop `lofipod-dev.jks` into `app/`,
#     `git add app/lofipod-dev.jks && git commit && git push`.
#   - From then on every CI build signs with the same cert and APK updates
#     install in place — no more uninstall.
#
# Manual-only trigger so it never fires on a regular push (we don't want to
# regenerate the keystore by accident — that would re-introduce the
# "different signer, must uninstall" pain). The job also refuses to overwrite
# an existing checked-in keystore.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Refuse to overwrite an existing keystore
        run: |
          if [ -f app/lofipod-dev.jks ]; then
            echo "::error::app/lofipod-dev.jks already exists in the repo. Delete it first if you really mean to regenerate (this will break update-in-place for installed APKs)."
            exit 1
          fi

      - name: Generate strong random password
        id: password
        run: |
          PASSWORD="$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)"
          # Mask in subsequent log lines, then expose as a step output for
          # the next job. Step outputs are stored on the runner only — not
          # surfaced in the log unless explicitly echoed.
          echo "::add-mask::$PASSWORD"
          echo "value=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Generate keystore
        env:
          LOFIPOD_KEYSTORE_PASSWORD: ${{ steps.password.outputs.value }}
        run: bash app/generate-keystore.sh

      - name: Write password file (for separate artifact)
        env:
          PASSWORD: ${{ steps.password.outputs.value }}
        run: |
          # Don't `set -x` here — would leak the password into the log.
          {
            echo "LofiPod stable-signing keystore password"
            echo "========================================"
            echo
            echo "Password (save this to your password manager NOW — this artifact"
            echo "expires in 1 day):"
            echo
            echo "    $PASSWORD"
            echo
            echo "Then add it as a repo secret so future CI builds can sign with it:"
            echo
            echo "  1. GitHub repo → Settings → Secrets and variables → Actions"
            echo "  2. New repository secret"
            echo "  3. Name:  LOFIPOD_KEYSTORE_PASSWORD"
            echo "  4. Value: <the password above>"
            echo
            echo "Finally, download the lofipod-dev-keystore artifact, drop"
            echo "lofipod-dev.jks into app/, and commit:"
            echo
            echo "    git add app/lofipod-dev.jks"
            echo "    git commit -m \"Add stable sideload signing key\""
            echo "    git push"
          } > KEYSTORE_PASSWORD.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: lofipod-dev-keystore
          path: app/lofipod-dev.jks
          if-no-files-found: error
          retention-days: 7

      - name: Upload password artifact
        uses: actions/upload-artifact@v4
        with:
          name: lofipod-dev-keystore-password
          path: KEYSTORE_PASSWORD.txt
          if-no-files-found: error
          # Short retention — the password should land in your password
          # manager and a GitHub secret immediately. Treat the artifact as
          # transient one-time channel, not as long-term storage.
          retention-days: 1
