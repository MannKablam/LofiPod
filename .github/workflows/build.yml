name: Build debug APK

# Branches only — tag pushes are owned by release.yml. Without the filter,
# both workflows fire on a `git push origin v0.3.0`, which is wasteful and
# produces a confusing artifact alongside the real release.
on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        # LOFIPOD_KEYSTORE_PASSWORD is the secret you set after running the
        # bootstrap-keystore workflow. When unset (e.g. on a fork without the
        # secret, or before bootstrap), the gradle script falls back to AGP's
        # default debug signing and the build still succeeds — it just won't
        # be installable in-place over an existing version.
        env:
          LOFIPOD_KEYSTORE_PASSWORD: ${{ secrets.LOFIPOD_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          # Tag-driven Releases are the canonical install source now —
          # this artifact is just a "did the commit build" sanity check.
          # 7-day retention keeps Actions storage tidy on the 500 MB Free
          # quota without losing recent debugging value.
          retention-days: 7

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
